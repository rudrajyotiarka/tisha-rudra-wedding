<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Gallery — Tisha &amp; Rudra Wedding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero-nav">
      <a class="brand" href="index.html">T&R</a>
      <nav>
        <a href="index.html">home</a>
        <a href="story.html">story</a>
        <a href="place.html">place</a>
        <a href="wishes.html">wishes</a>
        <a href="gallery.html" aria-current="page">gallery</a>
        <a href="contact.html">contact</a>
      </nav>
    </header>

    <main class="gallery">
      <section class="gallery-panel">
        <h1 class="gallery-title">share your moments</h1>
        <p class="gallery-subtitle">upload photos with us and from the wedding</p>

        <p class="gallery-notice" id="gallery-notice" hidden></p>

        <div class="gallery-upload">
          <h2>add a photo</h2>
          <form id="gallery-form" class="gallery-form">
            <div class="gallery-form-row">
              <div class="gallery-form-field">
                <label class="gallery-label" for="gallery-name">your name</label>
                <input
                  id="gallery-name"
                  name="name"
                  type="text"
                  maxlength="80"
                  placeholder="e.g. ananya"
                  required
                  autocomplete="name"
                />
              </div>

              <div class="gallery-form-field">
                <label class="gallery-label" for="gallery-caption">caption (optional)</label>
                <input
                  id="gallery-caption"
                  name="caption"
                  type="text"
                  maxlength="120"
                  placeholder="dance floor magic"
                />
              </div>
            </div>

            <div class="gallery-form-field">
              <label class="gallery-label" for="gallery-photo">choose a photo</label>
              <input
                id="gallery-photo"
                name="photo"
                type="file"
                accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
                required
              />
              <p class="gallery-hint">jpg, png, or webp · max 5 mb</p>
            </div>

            <button type="submit" id="gallery-submit">upload photo</button>
            <p class="gallery-form-status" id="gallery-form-status" role="status" aria-live="polite"></p>
          </form>
        </div>

        <div class="gallery-display">
          <h2>our shared album</h2>
          <div class="gallery-grid" id="gallery-grid">
            <p class="gallery-empty">loading photos...</p>
          </div>
        </div>
      </section>
    </main>

    <script src="music.js"></script>
    <script src="wishes-config.js"></script>
    <script src="gallery.js"></script>
    <script src="script.js"></script>
  </body>
</html>
